name: Deploy Sistem Kehadiran

on:
  push:
    branches:
      - ccr-fc5d8e38-yw0a96
      - main
    paths:
      - "kehadiran/**"
      - ".github/workflows/deploy-kehadiran.yml"
  workflow_dispatch:

concurrency:
  group: deploy-kehadiran
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kehadiran
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kehadiran/package-lock.json

      - name: Semak secret
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum ditambah di GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - run: npm ci

      - name: Kemas kini skema pangkalan data
        run: npx wrangler d1 migrations apply kehadiran-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Tetapkan kata laluan pentadbir
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then
            printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else
            echo "::warning::Secret ADMIN_PASSWORD tiada. Log masuk 'admin' tidak akan berfungsi sehingga ia ditetapkan."
          fi
